<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{t .Title}} · Eho</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body{{with .BodyClass}} class="{{.}}"{{end}}>
  <header class="topbar">
    <a class="brand" href="/">Eho</a>
    <nav>
      {{with .Principal}}
        {{if eq .Role "organizer"}}
          <a href="/org/events">{{t "nav.my_events"}}</a>
        {{else if .Onboarded}}
          <a href="/me/events">{{t "nav.my_events"}}</a>
          <a href="/me/profile">{{t "nav.profile"}}</a>
        {{end}}
        <span class="who">{{.Name}}</span>
        <form method="post" action="/logout" class="inline">
          {{template "csrf" $.CSRF}}
          <button class="btn btn-link" type="submit">{{t "nav.logout"}}</button>
        </form>
      {{else}}
        <a href="/login">{{t "nav.login"}}</a>
      {{end}}
    </nav>
  </header>
  <main class="container">
    {{with .Flash}}<p class="flash" role="status">{{t .}}</p>{{end}}
    {{block "content" .}}{{end}}
  </main>
</body>
</html>
