name: eho
description: "Eho venue map: attendee viewer and organizer editor."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cloud_firestore: ^6.10.0
  eho_maps:
    path: ../maps
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_storage: ^13.6.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  flutter_web_plugins:
    sdk: flutter
  geolocator: ^14.1.1
  go_router: ^18.0.2
  http: ^1.6.0
  intl: ^0.20.3
  latlong2: ^0.10.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
